<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compras local o global?</title>
<style>
  :root { --verde:#1b5e20; --verde-medio:#2e7d32; --verde-claro:#e8f5e9; --cielo:#e0f2f1; --error:#b71c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--cielo) 0%,var(--verde-claro) 100%); color:#1b2a1c; line-height:1.5; min-height:100vh; }
  header { background:var(--verde); color:#fff; padding:28px 16px; text-align:center; }
  header h1 { margin:0 0 8px; font-size:clamp(1.5rem,4vw,2.2rem); }
  header p { margin:0 auto; max-width:640px; opacity:.95; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 40px; }
  form { display:grid; gap:14px; }
  fieldset { background:#fff; border:none; border-radius:14px; padding:14px 18px 16px; box-shadow:0 2px 10px rgba(0,0,0,.08); margin:0; }
  legend { font-weight:700; color:var(--verde); padding:0 6px; }
  .opciones { display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px; }
  @media (min-width:600px){ .opciones { grid-template-columns:1fr 1fr; } }
  .opcion { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid #a5d6a7; border-radius:8px; background:#fafffa; cursor:pointer; }
  .opcion:has(input:checked) { background:var(--verde-claro); border-color:var(--verde-medio); font-weight:600; }
  .opcion input { width:20px; height:20px; accent-color:var(--verde-medio); margin:0; }
  .botones { display:grid; gap:10px; margin-top:6px; }
  @media (min-width:600px){ .botones { grid-template-columns:1fr 1fr; } }
  button { width:100%; padding:14px; font-size:1.05rem; font-weight:700; border:none; border-radius:10px; cursor:pointer; }
  #enviar { color:#fff; background:var(--verde-medio); }
  #reporte { color:var(--verde); background:#fff; border:2px solid var(--verde-medio); }
  button:hover:not(:disabled) { filter:brightness(.93); }
  button:disabled { background:#9e9e9e; color:#fff; border-color:#9e9e9e; cursor:wait; }
  #resultado { margin-top:22px; padding:18px; background:#fff; border-left:6px solid var(--verde-medio); border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08); white-space:pre-line; overflow-wrap:anywhere; }
  #resultado.error { border-left-color:var(--error); color:var(--error); }
  .oculto { display:none; }
  footer { text-align:center; font-size:.8rem; color:#555; padding:0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>¿Compras local o global?</h1>
  <p>Encuesta anónima sobre hábitos de compra para la materia de Desarrollo Sustentable. No se registran nombres.</p>
</header>

<main>
  <form id="formulario">
    <div id="preguntas"></div>
    <div class="botones">
      <button type="submit" id="enviar">Enviar respuesta</button>
      <button type="button" id="reporte">Generar reporte</button>
    </div>
  </form>
  <div id="resultado" class="oculto" role="status" aria-live="polite"></div>
</main>

<footer>Práctica 4.2 · Desarrollo Sustentable · TecNM Mazatlán.</footer>

<script>
  // PEGA AQUI LA URL DEL WEBHOOK DE MAKE (Webhooks > Custom webhook del escenario Encuesta_Equipo#)
  const WEBHOOK_URL = "https://hook.us2.make.com/erjv2ect5gw2klhh352ucrgqt5syeu6j";

  const PREGUNTAS = [
    { campo:"comida",  texto:"¿Dónde compras la mayor parte de tu comida?", opciones:["Mercado o tianguis","Tienda de barrio","Supermercado","En linea"] },
    { campo:"ropa",    texto:"¿Dónde compras tu ropa?", opciones:["Negocio local","Tienda departamental","App internacional","Segunda mano"] },
    { campo:"apps",    texto:"¿Con qué frecuencia compras en apps internacionales?", opciones:["Nunca","Una vez al mes","Varias veces al mes","Cada semana"] },
    { campo:"criterio",texto:"¿Qué pesa más al comprar?", opciones:["Precio","Calidad","Cercania","Apoyar lo local","Marca"] },
    { campo:"origen",  texto:"¿Sabes de dónde viene lo que compras?", opciones:["Si","A veces","No"] },
    { campo:"edad",    texto:"Rango de edad", opciones:["Menos de 18","18 a 29","30 a 49","50 o mas"] }
  ];

  const formulario = document.getElementById("formulario");
  const contenedor = document.getElementById("preguntas");
  const botonEnviar = document.getElementById("enviar");
  const botonReporte = document.getElementById("reporte");
  const resultado = document.getElementById("resultado");

  PREGUNTAS.forEach((p) => {
    const fs = document.createElement("fieldset");
    const lg = document.createElement("legend");
    lg.textContent = p.texto;
    fs.appendChild(lg);
    const grupo = document.createElement("div");
    grupo.className = "opciones";
    p.opciones.forEach((op) => {
      const lab = document.createElement("label");
      lab.className = "opcion";
      const r = document.createElement("input");
      r.type = "radio"; r.name = p.campo; r.value = op;
      lab.appendChild(r);
      lab.appendChild(document.createTextNode(op));
      grupo.appendChild(lab);
    });
    fs.appendChild(grupo);
    contenedor.appendChild(fs);
    contenedor.appendChild(document.createElement("div")).style.height = "14px";
  });

  function ocupado(si) {
    botonEnviar.disabled = si;
    botonReporte.disabled = si;
    if (si) resultado.className = "oculto";
  }

  async function enviar(datos, alTerminar) {
    ocupado(true);
    resultado.textContent = "Procesando...";
    resultado.className = "";
    try {
      const respuesta = await fetch(WEBHOOK_URL, { method: "POST", body: datos });
      if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
      resultado.textContent = await respuesta.text();
      resultado.className = "";
      if (alTerminar) alTerminar();
    } catch (err) {
      resultado.textContent = "No se pudo conectar, intenta de nuevo.";
      resultado.className = "error";
    } finally {
      botonEnviar.disabled = false;
      botonReporte.disabled = false;
    }
  }

  formulario.addEventListener("submit", (e) => {
    e.preventDefault();
    const datos = new URLSearchParams();
    datos.append("accion", "respuesta");
    for (const p of PREGUNTAS) {
      const marcada = formulario.querySelector('input[name="' + p.campo + '"]:checked');
      if (!marcada) {
        resultado.textContent = "Contesta todas las preguntas antes de enviar.";
        resultado.className = "error";
        return;
      }
      datos.append(p.campo, marcada.value);
    }
    enviar(datos, () => formulario.reset());
  });

  botonReporte.addEventListener("click", () => {
    const datos = new URLSearchParams();
    datos.append("accion", "reporte");
    enviar(datos);
  });
</script>
</body>
</html>
